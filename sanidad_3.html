<!DOCTYPE html>
<html lang="es" data-app="sanidad">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control sanitario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --fondo:#efebe7; --sup:#fdfbf9; --sup2:#f4efea;
  --linea:#ded3ca; --linea-suave:#e9e1da;
  --tinta:#1a1411; --tinta2:#4c403a; --muted:#6e6058;
  --acento:#1e6b73; --acento-tinta:#fff; --acento-suave:#dff0f1; --acento-linea:#a9d3d7;
  --ok:#3f6b46; --ok-suave:#e0ece1;
  --aviso:#8a5310; --aviso-suave:#f6e9d6;
  --malo:#96331f; --malo-suave:#f7e2de;
  --titulo:'Fraunces',Georgia,serif;
  --texto:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sombra:0 1px 2px rgba(26,20,17,.04), 0 8px 24px -14px rgba(26,20,17,.2);
  --radio:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]){
    --fondo:#171210; --sup:#1f1917; --sup2:#29211e;
    --linea:#342a26; --linea-suave:#26201d;
    --tinta:#f3ede9; --tinta2:#cdc2bb; --muted:#9a8c84;
    --acento:#7fd0d8; --acento-tinta:#0a2326; --acento-suave:#132a2d; --acento-linea:#22464b;
    --ok:#8fc39a; --ok-suave:#1b2a1e;
    --aviso:#e0b168; --aviso-suave:#2f2617;
    --malo:#ef8a76; --malo-suave:#33201c;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
  }
}
:root[data-tema="oscuro"]{
  --fondo:#171210; --sup:#1f1917; --sup2:#29211e;
  --linea:#342a26; --linea-suave:#26201d;
  --tinta:#f3ede9; --tinta2:#cdc2bb; --muted:#9a8c84;
  --acento:#7fd0d8; --acento-tinta:#0a2326; --acento-suave:#132a2d; --acento-linea:#22464b;
  --ok:#8fc39a; --ok-suave:#1b2a1e;
  --aviso:#e0b168; --aviso-suave:#2f2617;
  --malo:#ef8a76; --malo-suave:#33201c;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--texto);
     font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--titulo);font-weight:600;margin:0;letter-spacing:-.015em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:206px minmax(0,1fr);min-height:100vh}
.rail{background:var(--sup);border-right:1px solid var(--linea);display:flex;flex-direction:column;
      gap:2px;padding:18px 11px;position:sticky;top:0;height:100vh}
.marca{padding:4px 10px 16px}
.marca .nom{font-family:var(--titulo);font-size:22px;display:block;line-height:1.15}
.marca .sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em;
            text-transform:uppercase;margin-top:3px;display:block}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
     padding:8px 10px;border:0;background:transparent;border-radius:7px;cursor:pointer;
     color:var(--tinta2);text-align:left;font-size:13.5px;font-weight:500}
.nav:hover{background:var(--sup2);color:var(--tinta)}
.nav[aria-current="true"]{background:var(--acento-suave);color:var(--acento);font-weight:600}
.nav .cuenta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.nav[aria-current="true"] .cuenta{color:var(--acento)}
.pie-rail{margin-top:auto;padding:10px;border-top:1px solid var(--linea-suave);
          display:flex;flex-direction:column;gap:7px}
.pie-rail a{font-size:12px;color:var(--muted);text-decoration:none}
.pie-rail a:hover{color:var(--tinta)}
main{padding:24px 26px 80px;max-width:1240px;min-width:0}

.cabecera{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
          flex-wrap:wrap;margin-bottom:18px}
.cabecera h1{font-size:26px}
.cabecera p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:66ch}

.tarjeta{background:var(--sup);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra)}
.tarjeta-cab{padding:13px 16px;border-bottom:1px solid var(--linea-suave);display:flex;
             align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.tarjeta-cab h2{font-size:16px}
.tarjeta-cab .pista{font-size:12px;color:var(--muted)}
.tarjeta-cuerpo{padding:16px}

.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
        background:var(--linea-suave);border:1px solid var(--linea);border-radius:var(--radio);
        overflow:hidden;margin-bottom:18px}
.cifra{background:var(--sup);padding:13px 15px}
.cifra .k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cifra .v{font-size:22px;font-weight:600;margin-top:3px;letter-spacing:-.02em}
.cifra .v.acento{color:var(--acento)}
.cifra .v.malo{color:var(--malo)}
.cifra .n{font-size:11.5px;color:var(--muted);margin-top:1px}

.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
     color:var(--muted);font-weight:500}
input,select,textarea{background:var(--sup);border:1px solid var(--linea);border-radius:7px;
                      padding:7px 9px;font-size:13.5px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acento);outline:none;
                                        box-shadow:0 0 0 3px var(--acento-suave)}
textarea{resize:vertical;min-height:70px;line-height:1.6}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
     border:1px solid var(--linea);background:var(--sup);color:var(--tinta);padding:8px 14px;
     border-radius:7px;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.fuerte{background:var(--acento);border-color:var(--acento);color:var(--acento-tinta);font-weight:600}
.btn.fuerte:hover{filter:brightness(1.08)}
.btn.suave{border-color:transparent;background:transparent;color:var(--muted);padding:5px 8px}
.btn.suave:hover{background:var(--sup2);color:var(--tinta)}
.btn.malo{color:var(--malo)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.grande{padding:13px 22px;font-size:16px}

.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.nota{font-size:12.5px;color:var(--muted);margin:0 0 12px;max-width:74ch}

.filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.grupo{display:inline-flex;background:var(--sup);border:1px solid var(--linea);border-radius:8px;overflow:hidden}
.grupo button{border:0;background:transparent;padding:6px 13px;cursor:pointer;font-size:13px;
              color:var(--muted);font-weight:500;border-right:1px solid var(--linea-suave)}
.grupo button:last-child{border-right:0}
.grupo button[aria-pressed="true"]{background:var(--acento-suave);color:var(--acento);font-weight:600}
.buscador{flex:1;min-width:170px;max-width:340px}

/* El título de cada grupo cuando se ven todas juntas */
.grupoTipo{font-family:var(--titulo);font-size:17px;font-weight:600;margin:6px 0 10px;
           display:flex;align-items:baseline;gap:10px}
.grupoTipo span{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.grupoTipo::after{content:"";flex:1;height:1px;background:var(--linea)}

/* ── Fichas de receta ─────────────────────────────────────────────── */
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.receta{background:var(--sup);border:1px solid var(--linea);border-radius:var(--radio);
        box-shadow:var(--sombra);padding:13px 15px;text-align:left;cursor:pointer;
        color:inherit;font:inherit;display:flex;flex-direction:column;gap:5px}
.receta:hover{border-color:var(--acento-linea)}
/* La foto ocupa el ancho de la ficha, arriba del todo */
.receta{padding:0;overflow:hidden}
.receta>*:not(.foto){margin-left:15px;margin-right:15px}
.receta>.chapa:first-of-type{margin-top:13px}
.receta>.pie{margin-bottom:13px}
.receta .foto{display:block;margin:0;aspect-ratio:16/10;background:var(--sup2);
              border-bottom:1px solid var(--linea-suave)}
.receta .foto img{width:100%;height:100%;object-fit:cover;display:block}
.receta .nom{font-family:var(--titulo);font-size:17px;font-weight:600;line-height:1.2}
.receta .meta{font-size:12px;color:var(--muted)}
.receta .pie{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

.chapa{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
       font-size:11px;font-weight:600;white-space:nowrap}
.chapa.ok{background:var(--ok-suave);color:var(--ok)}
.chapa.aviso{background:var(--aviso-suave);color:var(--aviso)}
.chapa.malo{background:var(--malo-suave);color:var(--malo)}
.chapa.acento{background:var(--acento-suave);color:var(--acento)}
.chapa.neutra{background:var(--sup2);color:var(--muted);border:1px solid var(--linea)}

/* ── Paso a paso ──────────────────────────────────────────────────── */
.pasos{counter-reset:paso}
.paso{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--linea-suave);
      align-items:flex-start}
.paso:last-child{border-bottom:0}
.paso .n{counter-increment:paso;flex:0 0 auto;width:26px;height:26px;border-radius:50%;
         background:var(--acento-suave);color:var(--acento);display:flex;align-items:center;
         justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600}
.paso .n::before{content:counter(paso)}
.paso .t{flex:1;min-width:0;line-height:1.65}
.paso.hecho .t{opacity:.45;text-decoration:line-through}

.cocina{position:fixed;inset:0;background:var(--fondo);z-index:80;display:flex;
        flex-direction:column;padding:20px}
.cocina .arriba{display:flex;justify-content:space-between;align-items:center;gap:12px;
                flex-wrap:wrap;margin-bottom:8px}
.cocina .cuenta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cocina .texto{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
               font-size:clamp(20px,4.2vw,34px);line-height:1.45;font-family:var(--titulo);
               padding:14px;max-width:24ch;margin:0 auto}
.cocina .abajo{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cocina .barra{height:5px;background:var(--sup2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.cocina .barra i{display:block;height:100%;background:var(--acento);border-radius:3px}

.tabla-caja{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
   color:var(--muted);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--linea-suave);vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px}

.vacio{padding:34px 16px;text-align:center;color:var(--muted);font-size:13.5px;
       border:1px dashed var(--linea);border-radius:var(--radio)}
.vacio strong{display:block;color:var(--tinta);font-family:var(--titulo);font-size:16px;
              font-weight:600;margin-bottom:5px}

dialog{border:1px solid var(--linea);border-radius:var(--radio);background:var(--sup);color:var(--tinta);
       padding:0;max-width:640px;width:calc(100% - 32px);box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(20,14,11,.55)}
.dlg-cab{padding:15px 18px;border-bottom:1px solid var(--linea-suave);display:flex;
         justify-content:space-between;align-items:center}
.dlg-cab h3{font-size:17px}
.dlg-cuerpo{padding:18px;max-height:68vh;overflow:auto}
.dlg-pie{padding:13px 18px;border-top:1px solid var(--linea-suave);display:flex;gap:9px;
         justify-content:flex-end;flex-wrap:wrap}

.aviso-flotante{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinta);
                color:var(--fondo);padding:10px 18px;border-radius:22px;font-size:13.5px;font-weight:500;
                box-shadow:0 10px 30px -8px rgba(0,0,0,.5);z-index:120;max-width:88vw;text-align:center}
.aviso-flotante.malo{background:var(--malo);color:#fff}

#cargando{position:fixed;inset:0;background:var(--fondo);display:flex;align-items:center;
          justify-content:center;flex-direction:column;gap:14px;z-index:99;padding:24px;text-align:center}
#cargando .msg{font-family:var(--titulo);font-size:19px}
#cargando .sub{font-size:13px;color:var(--muted);max-width:34ch;line-height:1.5}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
        padding:11px;gap:6px;border-right:0;border-bottom:1px solid var(--linea)}
  .marca{padding:0 10px 0 4px;flex:1 0 100%}
  .marca .sub{display:none}
  .nav{width:auto}
  .nav .cuenta{display:none}
  .pie-rail{margin:0 0 0 auto;border:0;padding:0;flex-direction:row;gap:12px;align-items:center}
  main{padding:16px 13px 70px}
}



/* ── Sanidad ──────────────────────────────────────────────────────── */
.quien{display:flex;align-items:center;gap:10px;margin:0 0 14px;max-width:420px}
.quien .lbl{white-space:nowrap}
.fila-eq{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--linea-suave);flex-wrap:wrap}
.fila-eq:last-of-type{border-bottom:0}
.eq-nom{display:flex;flex-direction:column;min-width:150px}
.eq-nom small{color:var(--muted);font-size:12px}
.eq-ts{display:flex;gap:10px}
.t-caja{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.t-caja input{width:96px;text-align:center;font-size:20px;font-weight:600;padding:8px 6px;font-family:var(--texto);border-width:1.5px}
.t-caja small{font-size:10.5px;text-transform:none;letter-spacing:0;font-family:var(--texto)}
.t-caja.bien input{border-color:var(--ok);background:var(--ok-suave);color:var(--ok)}
.t-caja.mal input{border-color:var(--malo);background:var(--malo-suave);color:var(--malo)}
.accion{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 4px 10px;font-size:13px}
.tarea{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--linea-suave);cursor:pointer}
.tarea:last-child{border-bottom:0}
.tarea input{width:22px;height:22px;accent-color:var(--acento);flex:none;margin:0}
.tarea .t-nom{flex:1;font-size:14.5px}
.tarea .t-quien{font-size:12px;color:var(--muted);white-space:nowrap}
.tarea.hecha .t-nom{color:var(--muted);text-decoration:line-through}
.fila-rec{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linea-suave);
          background:transparent;padding:11px 4px;cursor:pointer;font:inherit;color:inherit;flex-wrap:wrap}
.fila-rec:last-child{border-bottom:0}
.fila-rec:hover{background:var(--sup2)}
.meta-r{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
tr.clic{cursor:pointer}
tr.clic:hover td{background:var(--sup2)}
.mes-t td,.mes-t th{padding:6px 8px}
.mes-t tr.dom td{border-bottom:2px solid var(--linea)}
.mes-t td.falta{color:var(--linea)}
.mes-t td.t-mal{color:var(--malo);font-weight:700;background:var(--malo-suave)}
.mes-l th,.mes-l td{padding:5px 4px}
.mes-l td:first-child{min-width:170px;position:sticky;left:0;background:var(--sup);z-index:1}
.mes-l th:first-child{position:sticky;left:0;background:var(--sup);z-index:1}
.l-c{text-align:center;cursor:pointer;min-width:24px;font-weight:700;font-size:13px}
.l-c.ok-c{color:var(--ok);background:var(--ok-suave)}
.l-c.mal-c{color:var(--malo);background:var(--malo-suave)}
.l-c.toca-c{color:var(--acento)}
th.hoy-c{color:var(--acento)}
.rapidas{display:flex;flex-wrap:wrap;gap:6px}
.t-fila{display:flex;gap:4px;align-items:stretch}
.rueda-btn{border:1.5px solid var(--linea);background:var(--sup);color:var(--acento);border-radius:var(--radio-s);width:40px;font-size:20px;cursor:pointer;padding:0}
.rueda-btn:hover{border-color:var(--acento)}
.dlg-rueda{max-width:340px}
.rueda-caja{display:flex;flex-direction:column;align-items:center;gap:6px}
.rueda-paso{width:120px;justify-content:center}
.rueda-poner{width:200px;justify-content:center;padding:12px;font-size:16px;margin-top:4px}
.dlg-rueda .dlg-pie{padding-top:8px;padding-bottom:8px}
.rueda{position:relative;height:230px;width:200px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
       border:1px solid var(--linea);border-radius:12px;background:var(--sup2);scrollbar-width:none;outline:none}
.rueda::-webkit-scrollbar{display:none}
.rueda ul{list-style:none;margin:0;padding:92px 0}
.rueda li{height:46px;line-height:46px;text-align:center;font-size:19px;scroll-snap-align:center;cursor:pointer;opacity:.45;font-variant-numeric:tabular-nums;transition:opacity .1s,font-size .1s}
.rueda li.r-bien{color:var(--ok)}
.rueda li.r-mal{color:var(--malo)}
.dlg-sub{max-width:340px}
.rueda li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.rueda li.sel{opacity:1;font-size:26px;font-weight:700}
.rueda-marco{position:sticky;top:92px;height:46px;margin-bottom:-46px;border-top:2px solid var(--acento);border-bottom:2px solid var(--acento);pointer-events:none;z-index:1}
.chips-q{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip-q{border:1px solid var(--linea);background:var(--sup);color:var(--tinta);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip-q.on,.chip-q:hover{border-color:var(--acento);background:var(--acento-suave);color:var(--acento);font-weight:600}
.flechas{display:inline-flex;gap:2px;margin-right:8px;vertical-align:middle}
.flechas .btn{padding:2px 7px;font-size:11px;line-height:1.4}
.flechas .btn:disabled{opacity:.25;cursor:default}
.btn.malo-f{background:var(--malo);border-color:var(--malo);color:#fff}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:inline-flex;border:1px solid var(--linea);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sup);padding:7px 12px;cursor:pointer;font-size:13px;color:var(--muted);border-right:1px solid var(--linea-suave)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acento-suave);color:var(--acento);font-weight:600}
.seg button:disabled{cursor:default}
@media (max-width:560px){
  .dos,.tres{grid-template-columns:1fr}
  .eq-ts{width:100%;justify-content:flex-start}
  .t-caja input{width:110px}
  .quien{flex-direction:column;align-items:stretch;gap:4px}
}
</style>
</head>
<body>

<div id="cargando">
  <div class="msg">Abriendo el control sanitario…</div>
  <div class="sub" id="cargando-sub">Descargando tus datos del repositorio privado.</div>
</div>

<div id="root" class="app"></div>

<script src="sync.js?v=202611121140"></script>
<script>
(function(){
  var capa = document.getElementById('cargando');
  var sub  = document.getElementById('cargando-sub');
  if (!window.Sync) {
    capa.querySelector('.msg').textContent = 'Esta página se abre desde internet';
    sub.innerHTML = 'Así, abierta desde el ordenador, no puede llegar a tus datos. Súbela a GitHub y ábrela en ' +
      '<a href="https://valitolerio.github.io/apps/sanidad.html">valitolerio.github.io/apps/sanidad.html</a>.';
    return;
  }
  Sync.iniciar('sanidad').then(function(){
    var s = document.createElement('script');
    s.src = 'sanidad.js?v=202611121140' + Date.now();
    s.onload = function(){ capa.remove(); };
    s.onerror = function(){ sub.textContent = 'No se pudo cargar sanidad.js. Recarga la pagina.'; };
    document.body.appendChild(s);
  }).catch(function(err){
    if (err.message === 'sin-credenciales') { location.href = 'index.html?volver=sanidad.html'; return; }
    capa.querySelector('.msg').textContent = 'No he podido cargar tus datos';
    sub.innerHTML = err.message + '<br><br><a href="index.html">Volver al escritorio</a>';
  });
})();
</script>
</body>
</html>
